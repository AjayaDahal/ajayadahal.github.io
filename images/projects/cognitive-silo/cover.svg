<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-label="Cognitive Silo: a self-hosted AI stack on one GPU">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b3d"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#bg)"/>
  <text x="24" y="40" font-family="'JetBrains Mono',monospace" font-size="11" fill="#6b7280" letter-spacing="2">SELF-HOSTED AI</text>
  <text x="24" y="76" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="url(#acc)">Cognitive</text>
  <text x="24" y="106" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="url(#acc)">Silo</text>
  <text x="24" y="136" font-family="'JetBrains Mono',monospace" font-size="10" fill="#ffb547">Docker &#183; ROCm &#183; Radeon PRO W7900</text>
  <!-- fifteen services sharing one GPU -->
  <g fill="#1b2230" stroke="#ff8a3d" stroke-opacity="0.55">
    <rect x="266" y="20" width="18" height="18" rx="3"/><rect x="289" y="20" width="18" height="18" rx="3"/><rect x="312" y="20" width="18" height="18" rx="3"/><rect x="335" y="20" width="18" height="18" rx="3"/><rect x="358" y="20" width="18" height="18" rx="3"/>
    <rect x="266" y="43" width="18" height="18" rx="3"/><rect x="289" y="43" width="18" height="18" rx="3"/><rect x="312" y="43" width="18" height="18" rx="3"/><rect x="335" y="43" width="18" height="18" rx="3"/><rect x="358" y="43" width="18" height="18" rx="3"/>
    <rect x="266" y="66" width="18" height="18" rx="3"/><rect x="289" y="66" width="18" height="18" rx="3"/><rect x="312" y="66" width="18" height="18" rx="3"/><rect x="335" y="66" width="18" height="18" rx="3"/><rect x="358" y="66" width="18" height="18" rx="3"/>
  </g>
  <g stroke="#ff8a3d" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="275" y1="84" x2="321" y2="104"/><line x1="298" y1="84" x2="321" y2="104"/><line x1="321" y1="84" x2="321" y2="104"/><line x1="344" y1="84" x2="321" y2="104"/><line x1="367" y1="84" x2="321" y2="104"/>
  </g>
  <rect x="266" y="104" width="110" height="24" rx="5" fill="url(#acc)"/>
  <text x="321" y="120" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#14171c">ONE GPU</text>
</svg>
