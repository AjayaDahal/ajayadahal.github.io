<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" role="img" aria-label="Social Media Automation Engine: a content pipeline on Temporal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f1a"/>
      <stop offset="1" stop-color="#06070d"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#4fc3ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#bg)"/>
  <text x="24" y="40" font-family="'JetBrains Mono',monospace" font-size="11" fill="#6b7280" letter-spacing="2">CONTENT PIPELINE</text>
  <text x="24" y="76" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="url(#acc)">Temporal</text>
  <text x="24" y="106" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="url(#acc)">workflows</text>
  <text x="24" y="136" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4fc3ff">Python &#183; Temporal &#183; FFmpeg</text>
  <!-- topic -> script -> render -> review -> publish -->
  <line x1="320" y1="28" x2="320" y2="132" stroke="#6f86ff" stroke-opacity="0.45" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono',monospace" font-size="10">
    <g fill="#141a2b" stroke="#6f86ff" stroke-opacity="0.6">
      <rect x="270" y="18" width="100" height="20" rx="10"/>
      <rect x="270" y="44" width="100" height="20" rx="10"/>
      <rect x="270" y="70" width="100" height="20" rx="10"/>
      <rect x="270" y="96" width="100" height="20" rx="10"/>
    </g>
    <rect x="270" y="122" width="100" height="20" rx="10" fill="url(#acc)"/>
    <g fill="#c7d2fe" text-anchor="middle">
      <text x="320" y="32">topic</text>
      <text x="320" y="58">script</text>
      <text x="320" y="84">render</text>
      <text x="320" y="110">review</text>
    </g>
    <text x="320" y="136" text-anchor="middle" font-weight="700" fill="#0c0f1a">publish</text>
  </g>
</svg>
